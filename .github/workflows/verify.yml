name: Verificar portal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Portal estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: portal
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: VictorFBio/sala-situacao-unai-v2
          ref: 109d7d5bb90a7b71f4313d341620b57f39b09d37
          path: painel
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: npm test
        working-directory: portal
        env:
          PANEL_SOURCE: ../painel
